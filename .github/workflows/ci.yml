name: CI

on:
  push:
    branches: [main]
  pull_request:

# The test suites are integration-heavy by design (docs/PROGRESS.md):
# @gg/api runs 175 tests against a real Postgres (gg_test) + Redis, and
# @gg/worker DB suites gate on TEST_DATABASE_URL. Migrations require the
# pgvector image (0007 creates the `vector` extension; ltree/pg_trgm are
# contrib). The Playwright suite needs live API+web instances, so it runs
# as a separate job that boots them per e2e/README.md.

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: gg
          POSTGRES_PASSWORD: gg
          POSTGRES_DB: gg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gg -d gg_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgres://gg:gg@localhost:5432/gg_test
      TEST_DATABASE_URL: postgres://gg:gg@localhost:5432/gg_test
      # Dedicated Redis in CI; index /5 mirrors the laptop recipe that
      # keeps test keys apart from anything else in the same server.
      REDIS_URL: redis://localhost:6379/5
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # API integration tests 404 without the seeded question bank
      # (Daily Pulse) and need the full schema, so migrate + seed first.
      - name: Prepare test database
        run: |
          pnpm --filter @gg/api db:migrate
          pnpm --filter @gg/api db:seed

      # @gg/e2e is excluded here only because it gets its own job below
      # (it needs running servers + a browser); every other suite runs.
      - name: Test
        run: pnpm test --filter=!@gg/e2e

      - name: Build
        run: pnpm build

      # Advisory: new CVEs land in the transitive tree without any code
      # change, so a hard gate here would turn CI permanently red for
      # unrelated work. Findings stay visible in this step's log.
      - name: Audit dependencies
        run: pnpm audit
        continue-on-error: true

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: gg
          POSTGRES_PASSWORD: gg
          POSTGRES_DB: gg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gg -d gg_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgres://gg:gg@localhost:5432/gg_test
      REDIS_URL: redis://localhost:6379/5
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare test database
        run: |
          pnpm --filter @gg/api db:migrate
          pnpm --filter @gg/api db:seed

      - name: Build API and worker
        run: pnpm build --filter=@gg/api --filter=@gg/worker

      # Per e2e/README.md: the web app is built into .next-e2e with the
      # API base URL baked to the e2e API instance on :4100.
      - name: Build web for e2e
        env:
          NEXT_DIST_DIR: .next-e2e
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:4100
        run: pnpm --filter @gg/web build

      - name: Install Playwright Chromium
        run: pnpm --filter @gg/e2e exec playwright install --with-deps chromium

      - name: Start API (:4100) and web (:3202)
        env:
          NEXT_DIST_DIR: .next-e2e
        run: |
          export MEDIA_DIR="$RUNNER_TEMP/gg-media"
          mkdir -p "$MEDIA_DIR"
          API_PORT=4100 \
          CORS_ORIGINS=http://127.0.0.1:3202,http://localhost:3202 \
            nohup pnpm --filter @gg/api start > "$RUNNER_TEMP/api.log" 2>&1 &
          nohup pnpm --filter @gg/web exec next start -p 3202 > "$RUNNER_TEMP/web.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4100/api/v1/health > /dev/null && \
               curl -sf http://127.0.0.1:3202 > /dev/null; then
              echo "API and web are up"
              exit 0
            fi
            sleep 2
          done
          echo "Instances did not come up; logs follow"
          cat "$RUNNER_TEMP/api.log" "$RUNNER_TEMP/web.log"
          exit 1

      # DATABASE_URL + MEDIA_DIR are exported for the media spec, which
      # spawns the built worker itself against the same store as the API.
      - name: Run Playwright suite
        run: |
          export MEDIA_DIR="$RUNNER_TEMP/gg-media"
          pnpm --filter @gg/e2e test

      - name: Upload e2e diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          path: |
            ${{ runner.temp }}/api.log
            ${{ runner.temp }}/web.log
            e2e/test-results
          if-no-files-found: ignore
