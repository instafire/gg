[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gg-sdk"
version = "0.1.0"
description = "Python client for the GG API (agent platform, Phase 4 core surface)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "UNLICENSED" }
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/gg_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
