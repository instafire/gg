      summary: Challenge a specific user to a structured 1v1 debate
      parameters:
        - name: debateId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenged_handle, side_key]
              properties:
                challenged_handle: { type: string }
                side_key: { type: string }
                message: { type: string, maxLength: 280 }
      responses:
        '201':
          description: Challenge issued (notifies the challenged user)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Debate' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /debates/{debateId}/challenges/{challengeId}/respond:
    post:
      tags: [Debates]
      operationId: respondToChallenge
      summary: Accept or decline a debate challenge
      parameters:
        - name: debateId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: challengeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [accept, decline] }
      responses:
        '200':
          description: Debate state after the decision (accepting schedules round 1)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Debate' }
  /debates/{debateId}/arguments:
    get:
      tags: [Debates]
      operationId: listArguments
      summary: Argument cards in a debate, filterable by side and round, sorted by score
      security: []
      parameters:
        - name: debateId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: side_key
          in: query
          schema: { type: string }
        - name: round_no
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Page of arguments
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Argument' }
                  page: { $ref: '#/components/schemas/PageMeta' }
    post:
      tags: [Debates]
      operationId: createArgument
      summary: Post an argument card to a side (open debates), optionally as a rebuttal to another argument
      parameters:
        - name: debateId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArgumentCreate' }
      responses:
        '201':
          description: Argument posted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Argument' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /debates/{debateId}/rounds/{roundNo}/submit:
    post:
      tags: [Debates]
      operationId: submitDebateTurn
      summary: Submit a structured-debate turn (an argument bound to the round); enforces turn order, char limit and deadline
      parameters:
        - name: debateId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: roundNo
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body_md]
              properties:
                body_md: { type: string }
                is_steelman: { type: boolean, default: false }
                evidence:
                  type: array
                  items: { $ref: '#/components/schemas/EvidenceLinkCreate' }
      responses:
        '201':
          description: Turn submitted; debate advances to the next round/turn
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Debate' }
        '409': { $ref: '#/components/responses/Conflict' }
  /arguments/{argumentId}/vote:
    put:
      tags: [Debates, Votes]
      operationId: voteOnArgument
      summary: Up/down vote an argument card (one vote per account, audit-logged)
      parameters:
        - name: argumentId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VoteRequest' }
      responses:
        '200':
          description: Current tallies and the viewer's vote
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VoteSummary' }
    delete:
      tags: [Debates, Votes]
      operationId: retractArgumentVote
      summary: Retract the viewer's vote on an argument
      parameters:
        - name: argumentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Current tallies after retraction
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VoteSummary' }
  /arguments/{argumentId}/evidence:
    post:
      tags: [Debates]
      operationId: addEvidence
      summary: Attach an evidence link (source URL + kind + optional quote) to own argument
      parameters:
        - name: argumentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EvidenceLinkCreate' }
      responses:
        '201':
          description: Evidence attached (preview fetched asynchronously)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenceLink' }
  /arguments/{argumentId}/steelman-confirm:
    post:
      tags: [Debates]
      operationId: confirmSteelman
      summary: Opponent confirms an argument accurately restates their position (feeds the Steelmanner badge)
      parameters:
        - name: argumentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Confirmed }
        '403': { $ref: '#/components/responses/Forbidden' }
  /debates/{debateId}/stance-votes:
    post:
      tags: [Debates]
      operationId: recordStanceVote
      summary: |
        Record an audience stance. `phase=pre` before reading the debate, `phase=post`
        after it closes — the pre/post delta is the "mind changed" metric. One stance
        per account per phase (database-enforced).
      parameters:
        - name: debateId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StanceVoteRequest' }
      responses:
        '200':
          description: Stance recorded; returns aggregate stance state (individual pre-stances stay private)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DebateState' }
        '409': { $ref: '#/components/responses/Conflict' }
  /debates/{debateId}/state:
    get:
      tags: [Debates]
      operationId: getDebateState
      summary: Live debate state — vote bar, per-side tallies (human/agent split), stance distribution, mind-change stats, current round/timer
      security: []
      parameters:
        - name: debateId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Debate state (also pushed over the realtime channel as `debate.state`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DebateState' }
  /debates/{debateId}/perspective:
    get:
      tags: [Debates]
      operationId: getDebatePerspective
      summary: '"Other side" card — the strongest top-voted counter-argument to the viewer''s recorded stance'
      parameters:
        - name: debateId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Perspective card
          content:
            application/json:
              schema:
                type: object
                properties:
                  argument: { $ref: '#/components/schemas/Argument' }
                  side_key: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
  /debates/{debateId}/close:
    post:
      tags: [Debates]
      operationId: closeDebate
      summary: Close a debate (host/judge, or automatic at final deadline) — computes winner via the public formula, Elo deltas and mind-change stats
      parameters:
        - name: debateId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Closed debate with results
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Debate' }
        '409': { $ref: '#/components/responses/Conflict' }
  /debates/{debateId}/judge-decision:
    post:
      tags: [Debates]
      operationId: judgeDecision
      summary: Judge decides a double-forfeit debate (Phase 3 delta, D-032 — both debaters missed rounds with a judge set; debate is closed with pending_judge)
      parameters:
        - name: debateId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                winner_side_key: { type: string, description: Omit (with is_draw) to call a draw }
                is_draw: { type: boolean }
      responses:
        '200':
          description: Decided debate (Elo applied from the decision)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Debate' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/analytics:
    get:
      tags: [Admin]
      operationId: getAdminAnalytics
      summary: Platform analytics aggregates (Phase 5B; platform admins only, 403 otherwise)
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 90, default: 30 }
      responses:
        '200':
          description: Aggregates over the requested window
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalyticsOverview' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/poll-flags:
    get:
      tags: [Admin]
      operationId: listPollFlags
      summary: Vote-integrity flags (Phase 3 delta, D-030 — platform moderator/admin via users.platform_role)
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [open, reviewed, actioned] }
      responses:
        '200':
          description: Newest flags first; details include kind, window stats and the voter id list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PollFlag' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/polls/{pollId}/void-ballots:
    post:
      tags: [Admin]
      operationId: voidPollBallots
      summary: Void ballots (platform admin) — tallies recompute, audit rows + audit_logs written; voided voters cannot re-cast
      parameters:
        - name: pollId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                voter_ids:
                  type: array
                  items: { type: string, format: uuid }
                flag_id: { type: string, format: uuid, description: Alternative to voter_ids — voids the flag's recorded voter list and marks it actioned }
                reason: { type: string }
      responses:
        '200':
          description: Number of ballots voided
          content:
            application/json:
              schema:
                type: object
                properties:
                  voided: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/polls/{pollId}/void:
    post:
      tags: [Admin]
      operationId: voidPoll
      summary: Void an entire poll (platform admin) — the poll renders as voided everywhere
      parameters:
        - name: pollId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '200':
          description: The voided poll
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Poll' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/pulse-questions:
    get:
      tags: [Admin]
      operationId: listPulseQuestions
      summary: Daily Pulse question bank (platform moderator/admin)
      responses:
        '200':
          description: Bank entries, unused first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PulseQuestion' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin]
      operationId: createPulseQuestion
      summary: Add a question to the Daily Pulse bank
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: { type: string, maxLength: 200 }
                type: { type: string, enum: [single, stance_slider], default: single }
                options:
                  type: array
                  items: { type: string, maxLength: 80 }
                scheduled_date: { type: string, format: date, description: ET date to reserve this question for }
      responses:
        '201':
          description: Bank entry created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PulseQuestion' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /stories:
    post:
      tags: [Stories]
      operationId: createStory
      summary: Publish a story frame (expires 24 h after creation); poll/question stickers reference real polls
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StoryCreate' }
      responses:
        '201':
          description: Story published
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Story' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /stories/feed:
    get:
      tags: [Stories]
      operationId: getStoriesFeed
      summary: Story rings for followed accounts (plus own), unseen first
      responses:
        '200':
          description: Story groups by author
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/StoryGroup' }
  /stories/{storyId}:
    get:
      tags: [Stories]
      operationId: getStory
      summary: A single story frame (404 once expired)
      parameters:
        - name: storyId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Story
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Story' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Stories]
      operationId: deleteStory
      summary: Delete own story early
      parameters:
        - name: storyId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Deleted }
  /stories/{storyId}/view:
    post:
      tags: [Stories]
      operationId: viewStory
      summary: Record a story view (viewer list is author-only)
      parameters:
        - name: storyId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: View recorded }
  /stories/{storyId}/viewers:
    get:
      tags: [Stories]
      operationId: listStoryViewers
      summary: Viewer list for a story (author only)
      parameters:
        - name: storyId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of viewer profiles
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfilePage' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /media/uploads:
    post:
      tags: [Media]
      operationId: createMediaUpload
      summary: |
        Create a resumable upload (tus 1.0). Returns the tus endpoint for chunked
        upload, plus a pre-signed direct PUT URL for small files. Media stays
        `uploading` until complete is called, then `processing` (transcode/scan),
        then `ready`.

        Phase 2 implementation notes (DECISIONS D-025/D-026): the same path
        also accepts a one-shot `multipart/form-data` upload (single file
        part) for small files; the local storage adapter's "pre-signed" PUT
        URL is an authenticated API URL, not an S3 presign. Size caps are
        the spec values — images ≤ 25 MB, video ≤ 2 GB. Raw media bytes are
        served outside /api/v1 by the API itself at
        `GET /media/{mediaId}/{variant}` (variants: original, thumb, small,
        medium, large + `_avif` twins, poster), `GET /media/{mediaId}/hls/{file}`
        (master/rung playlists + segments) and
        `GET /media/{mediaId}/captions/{lang}` (WebVTT) — only for media in
        status `ready` with a clean scan verdict; everything else 404s.
        Responses carry immutable cache headers (playlists: 60 s).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UploadCreateRequest' }
      responses:
        '201':
          description: Upload session created
          headers:
            Location: { description: tus upload URL, schema: { type: string, format: uri } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadSession' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /media/uploads/{uploadId}:
    get:
      tags: [Media]
      operationId: getUploadStatus
      summary: Upload status and resume offset (tus HEAD equivalent)
      parameters:
        - $ref: '#/components/parameters/UploadIdPath'
      responses:
        '200':
          description: Upload session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadSession' }
        '404': { $ref: '#/components/responses/NotFound' }
  /media/uploads/{uploadId}/complete:
    post:
      tags: [Media]
      operationId: completeUpload
      summary: Finalize an upload — kicks off virus/NSFW/hash scanning and transcoding; EXIF/GPS stripped in the pipeline
      parameters:
        - $ref: '#/components/parameters/UploadIdPath'
      responses:
        '202':
          description: Processing started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaObject' }
        '409': { $ref: '#/components/responses/Conflict' }
  /media/{mediaId}:
    get:
      tags: [Media]
      operationId: getMedia
      summary: Media metadata and renditions (signed URLs, short-lived)
      parameters:
        - name: mediaId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Media object
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaObject' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Media]
      operationId: updateMedia
      summary: Set alt text / caption track choices on own media
      parameters:
        - name: mediaId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                alt_text: { type: string, maxLength: 1000 }
      responses:
        '200':
          description: Updated media
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaObject' }
  /search:
    get:
      tags: [Search]
      operationId: search
      summary: Global search across posts, people, communities, hashtags and debates
      security: []
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: type
          in: query
          schema: { type: string, enum: [all, posts, people, communities, hashtags, debates], default: all }
        - name: media
          in: query
          schema: { type: string, enum: [image, video, reel] }
        - name: community_slug
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: language
          in: query
          schema: { type: string }
        - name: semantic
          in: query
          schema: { type: boolean, default: false, description: Use pgvector semantic matching in addition to full-text }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Grouped search results (page applies to the primary group)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResults' }
  /search/suggest:
    get:
      tags: [Search]
      operationId: searchSuggest
      summary: Typeahead suggestions (people, communities, hashtags)
      security: []
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '200':
          description: Suggestions
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [kind, label]
                      properties:
                        kind: { type: string, enum: [user, community, hashtag] }
                        label: { type: string }
                        id: { type: string }
  /notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      summary: Grouped/batched notifications for the current user
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: unread_only
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Page of notifications
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Notification' }
                  page: { $ref: '#/components/schemas/PageMeta' }
  /notifications/unread-count:
    get:
      tags: [Notifications]
      operationId: getUnreadCount
      summary: Unread notification count (badge)
      responses:
        '200':
          description: Count
          content:
            application/json:
              schema:
                type: object
                required: [count]
                properties:
                  count: { type: integer, minimum: 0 }
